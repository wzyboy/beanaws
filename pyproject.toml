[project]
name = "beanaws"
version = "0.1.0"
description = "AWS Invoice to Beancount"
readme = "README.md"
authors = [
    { name = "Zhuoyun Wei", email = "wzyboy@wzyboy.org" }
]
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.1.0",
    "click>=8.3.1",
    "pdftotext>=3.0.0",
]

[project.scripts]
beanaws = "beanaws.cli:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
